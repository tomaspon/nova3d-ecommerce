<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".2"/>
    </linearGradient>
    <path id="crown" d="M150 600 Q150 330 390 300 Q590 290 640 470 Q650 540 640 600 Z"/>
  </defs>
  <rect width="800" height="1000" fill="#ECEBE3"/>
  <ellipse cx="420" cy="700" rx="300" ry="26" fill="#000" opacity=".08"/>
  <!-- Copa -->
  <use href="#crown" fill="#6B7355"/>
  <use href="#crown" fill="url(#shade)"/>
  <!-- Costuras de los paneles y botón -->
  <path d="M398 302 Q440 450 470 600 M398 302 Q300 420 290 600" fill="none" stroke="#5A6147" stroke-width="6"/>
  <ellipse cx="398" cy="302" rx="16" ry="10" fill="#5A6147"/>
  <circle cx="250" cy="420" r="7" fill="#4E543E"/>
  <!-- Bordado al frente -->
  <text x="545" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-1" fill="#E8E4D4" transform="rotate(-6 545 500)">NORTE.</text>
  <!-- Visera hacia adelante -->
  <path d="M520 588 Q650 560 760 600 Q770 640 700 660 Q600 676 500 640 Z" fill="#5C6349"/>
  <path d="M520 588 Q650 560 760 600" fill="none" stroke="#4E543E" stroke-width="6"/>
  <path d="M150 600 L640 600" stroke="#4E543E" stroke-width="10" stroke-linecap="round"/>
</svg>
