<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800">
  <title>MINIMAL. — Primavera</title>
  <!-- Zona segura: en escritorio se ve la franja y 200-600 y en celular x 300-2100.
       Los motivos van a la derecha: a la izquierda se superpone el nombre de la campaña. -->
  <defs>
    <g id="petalos">
      <ellipse cx="0" cy="-110" rx="78" ry="110"/>
      <ellipse cx="0" cy="-110" rx="78" ry="110" transform="rotate(72)"/>
      <ellipse cx="0" cy="-110" rx="78" ry="110" transform="rotate(144)"/>
      <ellipse cx="0" cy="-110" rx="78" ry="110" transform="rotate(216)"/>
      <ellipse cx="0" cy="-110" rx="78" ry="110" transform="rotate(288)"/>
    </g>
  </defs>

  <rect width="2400" height="800" fill="#EDF1E4"/>

  <!-- Tallos y hojas -->
  <g stroke="#4F7F52" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M1720 400 C1722 500 1712 640 1700 800"/>
    <path d="M1440 470 C1446 560 1452 680 1458 800"/>
  </g>
  <ellipse cx="1665" cy="575" rx="62" ry="22" transform="rotate(-35 1665 575)" fill="#4F7F52"/>
  <ellipse cx="1495" cy="600" rx="48" ry="17" transform="rotate(30 1495 600)" fill="#4F7F52"/>

  <!-- Flor principal -->
  <g transform="translate(1720 380) scale(0.72)">
    <use href="#petalos" fill="#F2A3B5"/>
    <circle r="62" fill="#F6C443"/>
  </g>

  <!-- Flor chica -->
  <g transform="translate(1440 450) scale(0.4)">
    <use href="#petalos" fill="#E2849A"/>
    <circle r="62" fill="#F6C443"/>
  </g>

  <!-- Polen -->
  <g fill="#F6C443" opacity="0.8">
    <circle cx="1960" cy="280" r="11"/>
    <circle cx="2020" cy="350" r="7"/>
    <circle cx="1280" cy="320" r="9"/>
    <circle cx="1930" cy="500" r="8"/>
  </g>
</svg>
