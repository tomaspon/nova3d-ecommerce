<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800">
  <title>MINIMAL. — Verano</title>
  <!-- Zona segura: en escritorio se ve la franja y 200-600 y en celular x 300-2100.
       Los motivos van a la derecha: a la izquierda se superpone el nombre de la campaña. -->
  <rect width="2400" height="800" fill="#F3E4CE"/>

  <!-- Sol poniéndose sobre el mar -->
  <circle cx="1700" cy="440" r="235" fill="none" stroke="#FF6A3D" stroke-width="3" opacity="0.22"/>
  <circle cx="1700" cy="440" r="200" fill="none" stroke="#FF6A3D" stroke-width="3" opacity="0.4"/>
  <circle cx="1700" cy="440" r="160" fill="#FF6A3D"/>

  <!-- Mar -->
  <rect x="0" y="480" width="2400" height="320" fill="#1F5F75"/>
  <line x1="0" y1="480" x2="2400" y2="480" stroke="#16485A" stroke-width="6"/>

  <!-- Reflejo del sol -->
  <g stroke="#FF6A3D" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="1600" y1="505" x2="1800" y2="505"/>
    <line x1="1630" y1="530" x2="1770" y2="530"/>
    <line x1="1660" y1="555" x2="1740" y2="555"/>
  </g>

  <!-- Olas -->
  <g fill="none" stroke="#F3E4CE" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <path d="M1100 540 q40 -20 80 0 t80 0 t80 0 t80 0 t80 0"/>
    <path d="M1880 540 q40 -20 80 0 t80 0 t80 0"/>
    <path d="M1250 585 q40 -20 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
  </g>
</svg>
