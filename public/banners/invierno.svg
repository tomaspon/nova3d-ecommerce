<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800">
  <title>MINIMAL. — Invierno</title>
  <!-- Zona segura: en escritorio se ve la franja y 200-600 y en celular x 300-2100.
       Los motivos van a la derecha: a la izquierda se superpone el nombre de la campaña. -->
  <defs>
    <!-- Un brazo del copo; se repite seis veces girado -->
    <g id="brazo" stroke="#D6E7F5" stroke-width="12" stroke-linecap="round" fill="none">
      <line x1="0" y1="0" x2="0" y2="-220"/>
      <polyline points="-48,-150 0,-110 48,-150"/>
      <polyline points="-34,-205 0,-180 34,-205"/>
    </g>
    <g id="copo">
      <use href="#brazo"/>
      <use href="#brazo" transform="rotate(60)"/>
      <use href="#brazo" transform="rotate(120)"/>
      <use href="#brazo" transform="rotate(180)"/>
      <use href="#brazo" transform="rotate(240)"/>
      <use href="#brazo" transform="rotate(300)"/>
    </g>
  </defs>

  <rect width="2400" height="800" fill="#1B2433"/>

  <!-- Montañas -->
  <polygon points="950,800 1270,500 1590,800" fill="#26324A"/>
  <polygon points="1380,800 1830,450 2280,800" fill="#2E3C57"/>
  <polygon points="1740,520 1830,450 1920,520 1878,505 1830,535 1782,505" fill="#D6E7F5" opacity="0.9"/>

  <!-- Copos -->
  <use href="#copo" transform="translate(1700 360) scale(0.68)"/>
  <use href="#copo" transform="translate(1360 380) scale(0.32)"/>
  <use href="#copo" transform="translate(2010 300) scale(0.2)" opacity="0.7"/>

  <!-- Nieve -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="1080" cy="260" r="6"/>
    <circle cx="1180" cy="470" r="5"/>
    <circle cx="1500" cy="240" r="7"/>
    <circle cx="2100" cy="420" r="6"/>
    <circle cx="1560" cy="520" r="5"/>
    <circle cx="960" cy="380" r="4"/>
    <circle cx="1920" cy="230" r="5"/>
  </g>
</svg>
